name: Cross-platform artifacts

on:
  workflow_dispatch:
    inputs:
      signed:
        description: Sign Windows and macOS installers using configured publisher credentials
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run desktop:test
      - name: Launch desktop workspace (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run desktop:smoke
      - name: Launch desktop workspace (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run desktop:smoke
      - name: Validate signing configuration
        if: inputs.signed && runner.os != 'Linux'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            test -n "$WIN_CSC_LINK" && test -n "$WIN_CSC_KEY_PASSWORD" || { echo 'Configure Windows publisher certificate secrets.'; exit 1; }
          else
            test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD" && test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID" || { echo 'Configure macOS certificate and notarization secrets.'; exit 1; }
          fi
      - name: Build unsigned review artifacts
        if: ${{ !inputs.signed || runner.os == 'Linux' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run desktop:package
      - name: Build signed desktop installers
        if: inputs.signed && runner.os != 'Linux'
        env:
          CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            npm run desktop:package -- --config.forceCodeSigning=true --config.mac.notarize=true
          else
            npm run desktop:package -- --config.forceCodeSigning=true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.yml
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 14

  mobile:
    name: Android and iOS bundle verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run mobile:typecheck
      - run: npm run check -w @estatedesk/mobile
      - name: Export both native bundles
        env:
          EXPO_PUBLIC_API_URL: https://estatedesk.co.ke
        run: npm run mobile:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: native-javascript-bundles
          path: apps/mobile/dist
          retention-days: 14
