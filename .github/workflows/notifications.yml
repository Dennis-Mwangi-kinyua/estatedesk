name: Notification dispatch
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: notification-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    if: vars.NOTIFICATIONS_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch queued notifications
        env:
          APP_URL: ${{ vars.ESTATEDESK_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL" && test -n "$CRON_SECRET"
          case "$APP_URL" in https://*) ;; *) exit 1 ;; esac
          curl --fail --silent --show-error --max-time 65 --output /dev/null \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/notifications"
