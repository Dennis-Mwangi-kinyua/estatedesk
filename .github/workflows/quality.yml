name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: estatedesk
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: estatedesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estatedesk -d estatedesk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://estatedesk:ci-only-password@localhost:5432/estatedesk_test
      DIRECT_URL: postgresql://estatedesk:ci-only-password@localhost:5432/estatedesk_test
      AUTH_SECRET: ci-only-cookie-signing-secret-for-disposable-data
      ROLE_WORKSPACE_FIXTURE: /tmp/estatedesk-role-workspaces.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run security:audit

      - name: Report development-tool advisories
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Install Chromium for smoke tests
        run: npx playwright install --with-deps chromium

      - name: Apply test database migrations
        run: npx prisma migrate deploy

      - name: Run database integration and organisation-isolation tests
        env:
          TEST_DATABASE_URL: postgresql://estatedesk:ci-only-password@localhost:5432/estatedesk_test
        run: npm run test:integration

      - name: Seed fictional authenticated workspaces
        env:
          TEST_DATABASE_URL: postgresql://estatedesk:ci-only-password@localhost:5432/estatedesk_test
          TSX_TSCONFIG_PATH: apps/web/tsconfig.json
        run: node --conditions=react-server --import tsx scripts/qa/seed-role-workspaces.ts

      - name: Run browser smoke tests
        env:
          TEST_DATABASE_URL: postgresql://estatedesk:ci-only-password@localhost:5432/estatedesk_test
        run: npm run test:e2e

      - name: Verify disposable backup recovery
        env:
          ESTATEDESK_ENV_LOADED: "1"
          BACKUP_DATABASE_URL: postgresql://estatedesk:ci-only-password@localhost:5432/estatedesk_test
          RESTORE_DATABASE_URL: postgresql://estatedesk:ci-only-password@localhost:5432/estatedesk_restore_test
          CONFIRM_DISPOSABLE_RESTORE_DATABASE: "YES"
          PGPASSWORD: ci-only-password
        run: |
          createdb -h localhost -U estatedesk estatedesk_restore_test
          export BACKUP_DIR="$RUNNER_TEMP/recovery"
          export EVIDENCE_DIR="$RUNNER_TEMP/recovery-evidence"
          npm run backup:database
          backups=("$BACKUP_DIR"/*.dump)
          test "${#backups[@]}" -eq 1
          export BACKUP_FILE="${backups[0]}"
          npm run backup:validate
          npm run restore:drill

      - name: Retain sanitized recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: disposable-recovery-evidence
          path: ${{ runner.temp }}/recovery-evidence/*.json
          retention-days: 30

      - name: Build production application
        env:
          ESTATEDESK_BUILD_WITHOUT_DATABASE: "true"
        run: npm run build
