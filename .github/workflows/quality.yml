name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: estatedesk
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: estatedesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estatedesk -d estatedesk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://estatedesk:ci-only-password@localhost:5432/estatedesk_test
      DIRECT_URL: postgresql://estatedesk:ci-only-password@localhost:5432/estatedesk_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Install Chromium for smoke tests
        run: npx playwright install --with-deps chromium

      - name: Apply test database migrations
        run: npx prisma migrate deploy

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Build production application
        env:
          ESTATEDESK_BUILD_WITHOUT_DATABASE: "true"
        run: npm run build
