name: Verify Search Console property

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    if: ${{ secrets.GCP_SA_KEY != '' }}
    steps:
      - name: Set SITE_URL
        run: echo "SITE_URL=${{ secrets.SITE_URL || 'https://www.estatedesk.co.ke' }}" >> $GITHUB_ENV

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID || '' }}

      - name: Print access token
        id: token
        run: echo "TOKEN=$(gcloud auth print-access-token)" >> $GITHUB_ENV

      - name: Create Search Console property
        env:
          SITE_URL: ${{ env.SITE_URL }}
          TOKEN: ${{ env.TOKEN }}
        run: |
          SITE_ENC=$(python -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['SITE_URL'], safe=''))")
          curl -sS -X PUT \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            "https://www.googleapis.com/webmasters/v3/sites/$SITE_ENC"
