<!doctype html>
<html lang="en-KE">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>Offline | EstateDesk</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #020617;
          color: #f8fafc;
        }

        .card {
          background: #0f172a;
          border-color: rgba(255, 255, 255, 0.12);
        }

        .muted {
          color: #94a3b8;
        }

        .button {
          background: #f8fafc;
          color: #0f172a;
        }
      }

      .card {
        width: min(100vw - 3rem, 28rem);
        border: 1px solid #e2e8f0;
        border-radius: 0.75rem;
        background: #ffffff;
        padding: 1.5rem;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
      }

      .eyebrow {
        margin: 0;
        font-size: 0.875rem;
        font-weight: 500;
        color: #64748b;
      }

      h1 {
        margin: 0.75rem 0 0;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .muted {
        margin: 0.75rem 0 0;
        font-size: 0.875rem;
        line-height: 1.6;
        color: #64748b;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 1.5rem;
        min-height: 2.5rem;
        padding: 0 1rem;
        border: 0;
        border-radius: 0.5rem;
        background: #0f766e;
        color: #ffffff;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">EstateDesk</p>
      <h1>You are offline</h1>
      <p class="muted">
        EstateDesk could not reach the network. Reconnect and try again to load the latest
        dashboard, tenant, payment, or vacancy data.
      </p>
      <a class="button" href="/">Try EstateDesk again</a>
    </main>
  </body>
</html>
